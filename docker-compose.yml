services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hazardiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hazardiq_dev}
      POSTGRES_DB: ${POSTGRES_DB:-hazardiq}
    ports: ["5432:5432"]
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./database/init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U hazardiq -d hazardiq"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hazardiq}:${POSTGRES_PASSWORD:-hazardiq_dev}@postgres:5432/${POSTGRES_DB:-hazardiq}
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8000:8000"]
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    depends_on: [backend]
    ports: ["8080:80"]
volumes:
  pgdata:
